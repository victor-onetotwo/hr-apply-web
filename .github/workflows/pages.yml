# workflow นี้ถูกคัดลอกเข้า repo ของ GitHub Pages โดย deploy-pages.sh
# ไม่ได้ build อะไร — ไฟล์ถูก build มาแล้วจากเครื่อง แค่เอาขึ้น Pages
#
# ใช้แทน legacy build เพราะ legacy ล้มแล้วบอกแค่ "Page build failed" ไม่มี log ให้ดู
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
